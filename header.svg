<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Racing Car Paint Gradient -->
    <linearGradient id="car-paint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="35%" stop-color="#ff3366"/>
      <stop offset="70%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffbb00"/>
    </linearGradient>

    <!-- Nitro Exhaust Trail -->
    <linearGradient id="nitro-trail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0077ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ff0055" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Headlight Beam -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes driveCar {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(890px); }
    }

    @keyframes roadMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 242, 254, 0.5)); }
      50% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.9)); }
    }

    @keyframes textSlide1 {
      0%, 28% { opacity: 1; transform: translateY(0); }
      33%, 95% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes textSlide2 {
      0%, 30% { opacity: 0; transform: translateY(-6px); }
      35%, 62% { opacity: 1; transform: translateY(0); }
      67%, 100% { opacity: 0; transform: translateY(6px); }
    }

    @keyframes textSlide3 {
      0%, 64% { opacity: 0; transform: translateY(-6px); }
      69%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(6px); }
    }

    @keyframes flamePulse {
      0%, 100% { transform: scaleX(1); opacity: 0.8; }
      50% { transform: scaleX(1.3); opacity: 1; }
    }

    /* Applied Classes */
    .car-group {
      animation: driveCar 5.5s linear infinite;
    }

    .road-stripes {
      stroke-dasharray: 24, 18;
      animation: roadMotion 0.6s linear infinite;
    }

    .title-glow {
      animation: glowPulse 3s ease-in-out infinite;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 2.5px;
    }

    .text-msg-1 {
      animation: textSlide1 9s ease-in-out infinite;
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    .text-msg-2 {
      animation: textSlide2 9s ease-in-out infinite;
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    .text-msg-3 {
      animation: textSlide3 9s ease-in-out infinite;
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    .flame-anim {
      transform-origin: 0px 164px;
      animation: flamePulse 0.15s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="850" height="200" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- High-Tech Circuit & Speed Lines Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="35" x2="850" y2="35"/>
    <line x1="0" y1="70" x2="850" y2="70"/>
    <line x1="0" y1="105" x2="850" y2="105"/>
    <line x1="0" y1="140" x2="850" y2="140"/>
    <line x1="140" y1="0" x2="140" y2="200"/>
    <line x1="380" y1="0" x2="380" y2="200"/>
    <line x1="620" y1="0" x2="620" y2="200"/>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(35, 22)">
    <rect width="210" height="26" rx="13" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1"/>
    <text x="105" y="17" font-family="-apple-system, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="bold" text-anchor="middle" letter-spacing="1">
      🏁 WELCOME TO MY SPACE 🏎️
    </text>
  </g>

  <!-- Main Animated Neon Header -->
  <text x="35" y="86" class="title-glow" font-size="34" fill="url(#text-grad)">
    WELCOME TO MY PROFILE
  </text>

  <!-- Running / Cycling Subtitle Text Messages -->
  <g transform="translate(35, 122)">
    <!-- Message 1 -->
    <g class="text-msg-1">
      <text font-size="15" fill="#94a3b8" font-weight="600">
        👋 Hi, I'm <tspan fill="#f1f5f9" font-weight="bold">Fatikhur Rizki Nur Alfahrezi</tspan> • <tspan fill="#38bdf8">Informatics (S.Kom)</tspan>
      </text>
    </g>
    <!-- Message 2 -->
    <g class="text-msg-2">
      <text font-size="15" fill="#94a3b8" font-weight="600">
        🛡️ <tspan fill="#38bdf8" font-weight="bold">IT Support &amp; Network Specialist</tspan> • EC-Council CND &amp; ECIH
      </text>
    </g>
    <!-- Message 3 -->
    <g class="text-msg-3">
      <text font-size="15" fill="#94a3b8" font-weight="600">
        🚀 Passionate in <tspan fill="#38bdf8" font-weight="bold">Infrastructure, Linux Systems &amp; Problem Solving</tspan>
      </text>
    </g>
  </g>

  <!-- Circuit Asphalt Track at Bottom -->
  <rect x="0" y="152" width="850" height="48" fill="#050810"/>
  <!-- Glowing Curb Neon Line -->
  <line x1="0" y1="152" x2="850" y2="152" stroke="#00f2fe" stroke-width="2.5" opacity="0.8"/>
  <!-- Animated Dashed Lane Marker -->
  <line x1="0" y1="174" x2="850" y2="174" stroke="#38bdf8" stroke-width="2.5" class="road-stripes" opacity="0.6"/>
  <!-- Bottom Track Border -->
  <line x1="0" y1="198" x2="850" y2="198" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Checkered Finish Line at the Right Edge -->
  <g transform="translate(820, 153)" opacity="0.65">
    <rect x="0" y="0" width="8" height="8" fill="#ffffff"/>
    <rect x="8" y="0" width="8" height="8" fill="#1e293b"/>
    <rect x="0" y="8" width="8" height="8" fill="#1e293b"/>
    <rect x="8" y="8" width="8" height="8" fill="#ffffff"/>
    <rect x="0" y="16" width="8" height="8" fill="#ffffff"/>
    <rect x="8" y="16" width="8" height="8" fill="#1e293b"/>
    <rect x="0" y="24" width="8" height="8" fill="#1e293b"/>
    <rect x="8" y="24" width="8" height="8" fill="#ffffff"/>
    <rect x="0" y="32" width="8" height="8" fill="#ffffff"/>
    <rect x="8" y="32" width="8" height="8" fill="#1e293b"/>
    <rect x="0" y="40" width="8" height="8" fill="#1e293b"/>
    <rect x="8" y="40" width="8" height="8" fill="#ffffff"/>
  </g>

  <!-- Animated Race Car (F1 / GT Aerodynamic Supercar) -->
  <g class="car-group">
    <!-- Nitro Exhaust Flame & Light Stream -->
    <g class="flame-anim">
      <polygon points="-130,165 0,160 0,170 -130,168" fill="url(#nitro-trail)"/>
      <line x1="-150" y1="163" x2="-5" y2="163" stroke="#00f2fe" stroke-width="2" opacity="0.8" stroke-dasharray="16,10"/>
      <line x1="-110" y1="167" x2="-10" y2="167" stroke="#ff0055" stroke-width="2" opacity="0.7" stroke-dasharray="12,8"/>
    </g>

    <!-- Forward Headlight Beam -->
    <polygon points="105,163 240,150 240,185 105,172" fill="url(#beam-grad)"/>

    <!-- Ground Shadow Under Car -->
    <ellipse cx="55" cy="177" rx="58" ry="3.5" fill="#000000" opacity="0.85"/>

    <!-- Car Body -->
    <!-- Lower Chassis -->
    <path d="M 0,169 L 14,162 L 35,160 L 52,150 L 76,150 L 92,162 L 108,166 L 112,171 L 0,171 Z" fill="url(#car-paint)"/>
    
    <!-- Cockpit & Windshield -->
    <path d="M 52,151 L 58,157 L 76,157 L 73,151 Z" fill="#00f2fe" opacity="0.9"/>
    
    <!-- Aerodynamic Side Line Accent -->
    <line x1="28" y1="164" x2="88" y2="164" stroke="#ffffff" stroke-width="1" opacity="0.75"/>

    <!-- Rear Racing Wing / Spoiler -->
    <path d="M 0,155 L 8,155 L 6,163 L 0,163 Z" fill="#ffffff"/>
    <line x1="3" y1="158" x2="3" y2="168" stroke="#111827" stroke-width="2.5"/>

    <!-- Front Splitter & LED Headlight -->
    <rect x="106" y="169" width="9" height="3" rx="1.5" fill="#ffffff"/>
    <circle cx="104" cy="165" r="2.5" fill="#ffffff" filter="url(#neon-glow)"/>

    <!-- Wheels (Front & Rear) -->
    <!-- Rear Wheel -->
    <g transform="translate(26, 172)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffaa00"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
    <!-- Front Wheel -->
    <g transform="translate(88, 172)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffaa00"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
